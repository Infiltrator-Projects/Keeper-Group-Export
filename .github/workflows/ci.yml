name: Keeper Group Export CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip

      - name: Install pinned runtime dependency
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        shell: pwsh
        run: |
          python -m compileall -q keeper_group_export tests
          python -m py_compile Keeper-Group-Export-v3.8.pyw

      - name: Import application modules
        run: >-
          python -c "import keeper_group_export.app;
          import keeper_group_export.auth_flow;
          import keeper_group_export.auth_present;
          import keeper_group_export.auth_runtime;
          import keeper_group_export.common;
          import keeper_group_export.ui_actions;
          import keeper_group_export.ui_helpers;
          import keeper_group_export.ui_layout;
          import keeper_group_export.ui_styles;
          import keeper_group_export.vault"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Reject wildcard local imports
        shell: pwsh
        run: |
          $hits = Get-ChildItem keeper_group_export -Filter *.py |
            Select-String -SimpleMatch 'from .common import *'
          if ($hits) {
            $hits | ForEach-Object { Write-Error $_.Line }
            exit 1
          }

      - name: Parse PowerShell bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Keeper-Group-Export-Bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
