name: Publish Keeper Group Export 1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: 1a74873a74eb9baeaaff3c4f1e7af7ee427e502f
          fetch-depth: 0

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip

      - name: Validate release source
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q keeper_group_export tests
          python -m py_compile Keeper-Group-Export.pyw
          python -m unittest discover -s tests -v

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Keeper-Group-Export-Bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          $legacy = Get-ChildItem -Recurse -File -Include *.py,*.pyw,*.ps1,*.vbs,*.md,*.yml,*.txt |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Select-String -Pattern 'v3\.8|3\.8\.0|Keeper-Group-Export-v3\.8\.pyw'
          if ($legacy) {
            $legacy | Format-Table Path,LineNumber,Line -AutoSize
            throw 'Legacy development-version references remain in the release source.'
          }

          $emails = Get-ChildItem keeper_group_export -Recurse -File -Include *.py |
            Select-String -Pattern '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          if ($emails) {
            throw 'Hard-coded email-like value found in application source.'
          }

      - name: Build release package
        id: package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Keeper-Group-Export-v1.0.0'
          $zip = Join-Path $env:RUNNER_TEMP 'Keeper-Group-Export-v1.0.0.zip'
          $shaFile = "$zip.sha256"

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'Start Keeper Group Export.vbs' $stage
          Copy-Item 'Keeper-Group-Export-Bootstrap.ps1' $stage
          Copy-Item 'Keeper-Group-Export.pyw' $stage
          Copy-Item 'requirements.txt' $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'keeper_group_export' $stage -Recurse

          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  Keeper-Group-Export-v1.0.0.zip" | Set-Content -LiteralPath $shaFile -Encoding ascii

          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_file=$shaFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          SHA_PATH: ${{ steps.package.outputs.sha_file }}
        shell: pwsh
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @'
          # Keeper Group Export 1.0.0

          First stable release of Keeper Group Export.

          Highlights:
          - fast normal startup through a cached verified Python runtime;
          - Keeper Commander LoginUi authentication with device approval and supported 2FA channels;
          - dynamic live-vault folder discovery;
          - single-pass folder/record indexing;
          - Student / Email / Password preview and clean CSV export;
          - preview search and password masking;
          - remembered username stored locally only after successful sign-in;
          - fail-closed record export;
          - professional desktop UI and About screen;
          - pinned Keeper Commander dependency and Windows CI.

          Security note: exported CSV files contain plaintext passwords and must be protected as credential material.

          WebAuthn/security-key-only authentication is not currently driven by the Tkinter UI.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8NoBOM

          if (gh release view v1.0.0 --repo '${{ github.repository }}' 2>$null) {
            gh release delete v1.0.0 --repo '${{ github.repository }}' --cleanup-tag -y
          }

          gh release create v1.0.0 `
            "$env:ZIP_PATH#Keeper Group Export 1.0.0" `
            "$env:SHA_PATH#SHA-256 checksum" `
            --repo '${{ github.repository }}' `
            --target 1a74873a74eb9baeaaff3c4f1e7af7ee427e502f `
            --title 'Keeper Group Export 1.0.0' `
            --notes-file $notes

          if (gh release view v3.8.0 --repo '${{ github.repository }}' 2>$null) {
            gh release delete v3.8.0 --repo '${{ github.repository }}' --cleanup-tag -y
          }
